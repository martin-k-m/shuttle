# shuttle, read by spool. The subset spool parses is comments, one-level tables,
# quoted strings and single-line inline tables, and this file stays inside it.
name = "shuttle"
version = "0.1.0"

# Documentation only. twill has no package entry point, so spool records this
# and shows it in `spool list`; it does not enforce it.
entry = "src/predict.tw"

[dependencies]
# The language itself, pinned to the release whose std modules and tensor
# builtins this source was written against. spool has no notion of a toolchain
# dependency, so it is declared as an ordinary git dependency.
twill = { version = "^1.2.0", git = "https://github.com/martin-k-m/twill" }

# Reading model archives. A real dependency and not a convenience: loading
# through selvedge gets the model's declared input and output shapes out of the
# file, so shuttle's shape check is against what the model was published with
# rather than against what the serving code believes.
selvedge = { version = "^0.1.0", git = "https://github.com/martin-k-m/selvedge" }
