name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Two jobs. The source gate checks the things that are true of the
# repository whatever the compiler does, and the test job runs the suite
# against a released twill. The second one is new: until twill 1.6 there
# was no compiler that could run this code, and the comment here used to
# say so.
jobs:
  source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every source file is twill
        run: |
          stray=$(find . -path ./.git -prune -o -type f \
            ! -name '*.tw' ! -name '*.md' ! -name '*.yml' ! -name '*.toml' \
            ! -name 'LICENSE' ! -name '.gitignore' -print)
          if [ -n "$stray" ]; then
            echo "shuttle is written in twill; these files are neither .tw nor documentation:"
            echo "$stray"
            exit 1
          fi

      - name: No reference to the old language name
        run: |
          old=$(printf 'ras'; printf 'ter')
          if grep -rni "$old" --include='*.tw' --include='*.md' --include='*.toml' .; then
            echo "the language is twill"
            exit 1
          fi

      - name: No file carries the old source extension
        run: |
          old=$(printf '*.r'; printf 'a')
          if find . -name "$old" | grep .; then
            echo "twill source is .tw"
            exit 1
          fi
          if grep -rn "$(printf '\\.r'; printf 'a\\b')" --include='*.tw' --include='*.md' .; then
            echo "twill source is .tw"
            exit 1
          fi

      - name: No em dashes
        run: |
          dash=$(printf '\xe2\x80\x94')
          if grep -rn "$dash" --include='*.tw' --include='*.md' --include='*.toml' .; then
            echo "em dashes are not used in this repository"
            exit 1
          fi

      - name: Every twill source declares its mode
        run: |
          for f in $(find . -name '*.tw'); do
            if [ "$(head -n 1 "$f")" != "mode systems" ]; then
              echo "$f does not start with 'mode systems'"
              exit 1
            fi
          done


      - name: Every needs entry names a file
        run: |
          # A needs entry without a file to look at is a wish, not a work item.
          missing=$(grep -c '^### ' docs/needs.md)
          named=$(grep -c '^\*\*\(Used by\|Would improve\|Needs\)' docs/needs.md)
          if [ "$named" -lt "$missing" ]; then
            echo "docs/needs.md has $missing entries and only $named name a file"
            exit 1
          fi


  honesty-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The quantisation table is the one place in this repository where a
      # plausible-looking number could be invented. Every figure in it carries a
      # provenance label, and this job fails if the labels go missing, so
      # deleting one is a visible act in a diff rather than an edit.
      - name: Every figure in the quantisation table is labelled
        run: |
          # The vocabulary is the one src/quant.tw actually defines. PROJECTED
          # was in this list and in neither file: the table's own legend says
          # "GATED, not PROJECTED", because a projection is a guess and a gated
          # figure is arithmetic waiting on a storage change. This gate has been
          # red since it was written, demanding the word the table refuses.
          for label in DERIVED GATED UNMEASURED; do
            grep -q "$label" src/quant.tw || {
              echo "src/quant.tw no longer labels its figures $label"
              echo "an unlabelled number in that table is a claim nobody derived"
              exit 1
            }
            grep -q "$label" README.md || {
              echo "README.md no longer labels its quantisation figures $label"
              exit 1
            }
          done

      # twill stores every tensor as float64, so quantising does not shrink a
      # file today. If that ever stops being said out loud, the table above
      # becomes a lie by omission.
      - name: The quantisation size limit is stated plainly
        run: |
          grep -q 'DOES NOT MAKE THE FILE SMALLER' src/quant.tw || {
            echo "src/quant.tw must state that quantising does not shrink a file today"
            exit 1
          }
          grep -q 'does not make the file' README.md || {
            echo "README.md must state that quantising does not shrink a file today"
            exit 1
          }

      # The single most likely thing for a reader to assume and be wrong about.
      - name: The batching hold says what it is measured in
        run: |
          grep -q 'counts arrivals' README.md || {
            echo "README.md must state that max_hold counts arrivals and not milliseconds"
            exit 1
          }
          grep -q 'not milliseconds' src/batcher.tw || {
            echo "src/batcher.tw must state what the hold is measured in"
            exit 1
          }

      - name: Warmup states what it does not cover
        run: |
          grep -q 'NOT COVERED' src/warmup.tw || {
            echo "src/warmup.tw must list what warmup does not cover"
            exit 1
          }

      # A default here would be a heuristic wearing a constructor's clothes, and
      # it would be wrong for one of the two workloads this library is for.
      - name: The batching knobs have no default
        run: |
          grep -q 'fn config(max_batch: I64, max_hold: I64)' src/batcher.tw || {
            echo "src/batcher.tw config must require both numbers"
            exit 1
          }

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The twill binary comes from a release rather than being built here.
      # shuttle is written in twill and has no build of its own, so the only
      # thing CI needs is a compiler, and a released one is the version a user
      # would have. Pinned rather than floating: a green run should mean this
      # code passed against a known compiler, not against whatever was newest
      # that morning.
      - name: Install twill v1.6.6
        run: |
          curl -fsSL -o twill \
            https://github.com/twill-lang/twill/releases/download/v1.6.6/twill-v1.6.6-linux-amd64
          chmod +x twill
          ./twill --version

      # shuttle reads a model through selvedge's archive format, imported by a
      # path relative to this repository. On a developer's machine the two sit
      # side by side and it resolves; in CI only this repository is checked out,
      # so the tests could not run at all until this step existed. It is a real
      # dependency between two repositories and spool cannot vendor it yet, so
      # it is cloned here and the workflow says why.
      - name: Fetch selvedge, which shuttle imports
        run: git clone --depth 1 https://github.com/twill-lang/selvedge ../selvedge

      - name: Check every source file
        run: |
          skip=""
          fail=0
          for f in $(find src tests examples -name '*.tw' 2>/dev/null); do
            case " $skip " in *" $f "*) continue ;; esac
            if ! ./twill check "$f"; then
              fail=1
            fi
          done
          exit $fail

      - name: Run the tests
        run: ./twill test tests
